[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-intelligence"
version = "0.1.0"
description = "Deterministic, auditable quantitative research foundation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "alpaca-py>=0.40", "SQLAlchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "yfinance>=0.2"]
event_study = ["yfinance>=0.2"]

[project.scripts]
quant-intelligence = "quant_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
